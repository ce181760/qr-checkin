<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-label="Google App passwords create page">
  <rect width="680" height="430" fill="#ffffff"/>
  <rect width="680" height="48" fill="#e9eff7"/>
  <text x="20" y="32" font-family="Arial, sans-serif" font-size="26" fill="#111827">&#8592;</text>
  <text x="58" y="32" font-family="Arial, sans-serif" font-size="30" fill="#111827">App passwords</text>
  <text x="18" y="76" font-family="Arial, sans-serif" font-size="17" fill="#334155">App passwords help you sign in to your Google Account on older apps and</text>
  <text x="18" y="102" font-family="Arial, sans-serif" font-size="17" fill="#334155">services that don't support modern security standards.</text>
  <text x="18" y="146" font-family="Arial, sans-serif" font-size="17" fill="#334155">App passwords are less secure than using up-to-date apps and services</text>
  <text x="18" y="172" font-family="Arial, sans-serif" font-size="17" fill="#334155">that use modern security standards.</text>
  <text x="18" y="200" font-family="Arial, sans-serif" font-size="17" fill="#0b57d0">Learn more</text>
  <rect x="18" y="240" width="640" height="166" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="42" y="282" font-family="Arial, sans-serif" font-size="16" fill="#111827">You don't have any app passwords.</text>
  <text x="42" y="320" font-family="Arial, sans-serif" font-size="16" fill="#334155">To create a new app specific password, type a name for it below...</text>
  <rect x="42" y="330" width="590" height="58" fill="#dce3eb"/>
  <text x="60" y="364" font-family="Arial, sans-serif" font-size="18" fill="#334155">App name</text>
  <rect x="510" y="370" width="96" height="40" rx="20" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="536" y="396" font-family="Arial, sans-serif" font-size="15" fill="#9ca3af">Create</text>
</svg>
