<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/script.js" defer></script>
</head>
<body>
  <main>
    <img class="site-logo" src="/school-logo.jpeg" alt="School logo" />
    <h1>Student Attendance</h1>
    <form id="checkin-form" onsubmit="checkIn(); return false;">
      <fieldset class="action-options">
        <legend>What are you doing?</legend>
        <label>
          <input type="radio" name="action" value="drop_off" checked />
          Drop off
        </label>
        <label>
          <input type="radio" name="action" value="pick_up" />
          Pick up
        </label>
      </fieldset>
      <label for="studentName">Student name</label>
      <input id="studentName" name="studentName" type="text" required autocomplete="name" />
      <label for="parentName">Parent name</label>
      <input id="parentName" name="parentName" type="text" required autocomplete="name" />
      <div id="lateReasonGroup" class="late-reason-group" hidden>
        <label for="lateReason">Reason for being late</label>
        <textarea id="lateReason" name="lateReason" rows="4"></textarea>
      </div>
      <div id="latePaymentGroup" class="late-payment-group" hidden>
        <p class="late-payment-instructions">
          Late pick-up requires a $10 payment by Venmo to <strong>@phcs1166</strong>.
        </p>
        <a class="venmo-payment-link" href="https://venmo.com/phcs1166?txn=pay&amp;amount=10" target="_blank" rel="noopener">
          Pay $10 with Venmo
        </a>
        <label for="latePaymentReceipt">Receipt screenshot</label>
        <input id="latePaymentReceipt" name="latePaymentReceipt" type="file" accept="image/*" />
        <label class="checkbox-field" for="latePaymentConfirmed">
          <input id="latePaymentConfirmed" name="latePaymentConfirmed" type="checkbox" />
          I paid the $10 late pick-up fee to @phcs1166 and uploaded the receipt.
        </label>
      </div>
      <button type="submit">Submit</button>
    </form>
    <div id="message"></div>
  </main>
</body>
</html>
