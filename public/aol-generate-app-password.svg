<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" aria-label="AOL generate app password section">
  <rect width="680" height="270" fill="#ffffff"/>
  <text x="32" y="42" font-family="Arial, sans-serif" font-size="18" fill="#111827">Other ways to sign in</text>
  <rect x="32" y="62" width="616" height="166" rx="3" fill="#fbfbfd" stroke="#e5e7eb"/>
  <text x="52" y="100" font-family="Arial, sans-serif" font-size="18" fill="#111827">App Password</text>
  <text x="52" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">If you don't normally use a password to sign in to your AOL account, here's where you</text>
  <text x="52" y="164" font-family="Arial, sans-serif" font-size="16" fill="#475569">can generate a password for 3rd-party apps that require passwords.</text>
  <line x1="32" y1="194" x2="648" y2="194" stroke="#d1d5db"/>
  <text x="52" y="230" font-family="Arial, sans-serif" font-size="16" fill="#0645d8">Generate app password</text>
</svg>
