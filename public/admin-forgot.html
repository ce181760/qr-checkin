<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/admin-forgot.js" defer></script>
</head>
<body>
  <main>
    <div style="max-width:420px;margin:2rem auto;padding:1rem;border:1px solid #ddd;border-radius:6px;">
      <h1>Reset Admin Password</h1>
      <p>Enter the admin email or username to receive a reset link.</p>
      <form id="forgotForm" onsubmit="sendReset(); return false;">
        <label for="identifier">Email or username</label>
        <input id="identifier" type="text" placeholder="Email or username" required />
        <button type="submit">Send reset link</button>
      </form>
      <div id="message" style="margin-top:1rem;color:green;"></div>
      <div style="margin-top:1rem;"><a href="/admin">Back to login</a></div>
    </div>
  </main>
</body>
</html>
