<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Updated</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <img class="site-logo" src="/school-logo.jpeg" alt="School logo" />
    <h1>Attendance Updated</h1>
    <p id="successMessage">Thanks - your attendance update was successful.</p>
    <a href="/">Back to attendance</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const studentName = params.get('studentName');
    const parentName = params.get('parentName');
    const action = params.get('action');
    const actionTime = params.get('actionTime');
    const timingStatus = params.get('timingStatus');

    function formatArrivalTime(time) {
      const match = String(time || '').match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
      if (!match) {
        return time || '';
      }

      const hours = Number(match[1]);
      const minutes = match[2];
      if (Number.isNaN(hours) || hours < 0 || hours > 23) {
        return time;
      }

      const period = hours >= 12 ? 'PM' : 'AM';
      const displayHours = hours % 12 || 12;
      return `${displayHours}:${minutes} ${period}`;
    }

    function formatAction(actionValue) {
      return actionValue === 'pick_up' ? 'Pick-up' : 'Drop-off';
    }

    if (studentName || parentName || actionTime) {
      const actionLabel = formatAction(action);
      const message = [`${actionLabel} successful!`];
      if (studentName) message.push(`Student: ${studentName}`);
      if (parentName) message.push(`Parent: ${parentName}`);
      if (actionTime) message.push(`${actionLabel} time: ${formatArrivalTime(actionTime)}`);
      if (timingStatus) message.push(`${actionLabel} status: ${timingStatus}`);
      document.getElementById('successMessage').innerText = message.join('\n');
    }
  </script>
</body>
</html>
