<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-In Successful</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Check-In Successful</h1>
    <p id="successMessage">Thanks - your check-in was successful.</p>
    <a href="/">Back to check-in</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const studentName = params.get('studentName');
    const parentName = params.get('parentName');

    if (studentName || parentName) {
      const message = [];
      if (studentName) message.push(`Student: ${studentName}`);
      if (parentName) message.push(`Parent: ${parentName}`);
      document.getElementById('successMessage').innerText = `Check-in successful! ${message.join(' - ')}`;
    }
  </script>
</body>
</html>
