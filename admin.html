<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard - QR Check-In</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin-styles.css" />
  <script src="/admin.js" defer></script>
</head>
<body>
  <main>
    <!-- LOGIN SCREEN -->
    <div id="loginBox">
      <h1>Admin Login</h1>
      <form id="loginForm" onsubmit="login(); return false;">
        <label for="username">Username</label>
        <input id="username" type="text" required />
        <label for="password">Password</label>
        <input id="password" type="password" required />
        <button type="submit">Login</button>
        <div style="margin-top:0.5rem;text-align:center;"><a href="/admin/forgot">Forgot password?</a></div>
      </form>
      <div id="error" style="color: red; margin-top: 0.5rem; text-align: center;"></div>
    </div>

    <!-- DASHBOARD (hidden until login) -->
    <div id="dashboard" style="display: none;">
      <div class="dashboard-header">
        <div>
          <h1>Attendance Dashboard</h1>
          <p class="subtitle" id="dashboardSubtitle">Real-time digital monitoring &amp; reporting system</p>
        </div>
        <div class="user-controls">
          <span id="userName"></span>
          <button type="button" id="accountBtn" onclick="window.location.href='/admin/account'">Account</button>
          <button type="button" id="logoutBtn" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- DAILY SUMMARY / METRICS BANNER -->
      <div id="summaryBanner" class="summary-banner">
        <div class="summary-header-row">
          <h2 id="summaryTitle">Daily Attendance Summary</h2>
          <div class="summary-date-badge" id="summaryDateBadge"></div>
        </div>
        <div class="summary-cards">
          <div class="summary-card">
            <span class="card-icon">👥</span>
            <div class="card-info">
              <span class="card-value" id="statTotal">0</span>
              <span class="card-label">Total Check-ins</span>
            </div>
          </div>
          <div class="summary-card card-success">
            <span class="card-icon">✅</span>
            <div class="card-info">
              <span class="card-value" id="statOnTime">0</span>
              <span class="card-label">On Time</span>
            </div>
          </div>
          <div class="summary-card card-warning">
            <span class="card-icon">🕐</span>
            <div class="card-info">
              <span class="card-value" id="statLate">0</span>
              <span class="card-label">Late Arrivals</span>
            </div>
          </div>
          <div class="summary-card card-info">
            <span class="card-icon">📋</span>
            <div class="card-info">
              <span class="card-value" id="statPickups">0</span>
              <span class="card-label">Pick-ups / Dismissals</span>
            </div>
          </div>
        </div>
      </div>

      <!-- FILTER TABS & CONTROLS -->
      <div class="filter-controls-bar">
        <div class="view-tabs">
          <button type="button" class="tab-btn active" id="tabToday" onclick="setActiveTab('today')">Today's Check-ins</button>
          <button type="button" class="tab-btn" id="tabAll" onclick="setActiveTab('all')">All Records</button>
          <button type="button" class="tab-btn" id="tabLate" onclick="setActiveTab('late')">Late Only</button>
          <button type="button" class="tab-btn" id="tabPickups" onclick="setActiveTab('pickups')">Pick-ups Only</button>
        </div>

        <div class="auto-refresh-box">
          <label class="refresh-toggle">
            <input type="checkbox" id="autoRefreshToggle" onchange="toggleAutoRefresh()" />
            <span>Live Auto-Refresh (15s)</span>
          </label>
          <button type="button" class="icon-btn" onclick="loadData()" title="Refresh now">🔄 Refresh</button>
        </div>
      </div>

      <!-- SEARCH & DATE FILTER TOOLBAR -->
      <div id="adminToolbar" class="toolbar">
        <div class="search-box">
          <input id="search" type="search" placeholder="Search student, parent, or late reason..." oninput="applyFilters()" />
        </div>
        <div class="date-filter-box">
          <label for="filterDate">Filter Date:</label>
          <input type="date" id="filterDate" onchange="applyFilters()" />
          <button type="button" class="clear-date-btn" onclick="clearDateFilter()">Clear Date</button>
        </div>
        <div class="toolbar-actions">
          <button id="exportBtn" type="button" onclick="exportCSV()" class="btn-secondary">Export Excel / CSV</button>
          <button id="printTodayBtn" type="button" onclick="printTodayReport()" class="btn-primary">🖨️ Print Today's Report</button>
        </div>
      </div>

      <!-- RECORDS TABLE SECTION -->
      <div id="recordsSection">
        <div class="records-status-bar">
          Showing <strong id="visibleCount">0</strong> record(s)
        </div>
        <table class="attendance-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Parent / Guardian</th>
              <th>Drop-off</th>
              <th>Pick-up</th>
              <th>Reason Late</th>
              <th>Status</th>
              <th class="actions-column">Actions</th>
            </tr>
          </thead>
          <tbody id="data"></tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
